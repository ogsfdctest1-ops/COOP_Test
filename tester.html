<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>COOP テスター</title>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        button { padding: 10px 15px; font-size: 16px; cursor: pointer; }
        .log { margin-top: 15px; padding: 10px; background: #eee; border-radius: 4px; font-family: monospace; white-space: pre-wrap; }
    </style>
</head>
<body>
    <h2>COOP 検証用テスター（GitHub Pages）</h2>
    <p>下のボタンを押して Salesforce の Visualforce ページを新しいタブで開きます。</p>
    
    <button onclick="openVFPage()">Visualforce ページを開く</button>

    <div class="log" id="log">ログがここに表示されます...</div>

    <script>
        const TARGET_URL = "https://kog20240520--c.vf.force.com/apex/COOP_TestPage"; 
        let targetWindow = null;

        function openVFPage() {
            const logEl = document.getElementById('log');
            logEl.innerHTML = "新しいタブで Visualforce ページを開いています...\n";

            // ★ 第3引数は空にして参照を維持します（新しいタブで開く）
            targetWindow = window.open(TARGET_URL, '_blank');

            if (!targetWindow) {
                logEl.innerHTML += "⚠️ ポップアップブロック等によりタブを開くことができませんでした。\n";
                return;
            }

            // 2秒後に参照関係をテスト
            setTimeout(() => {
                logEl.innerHTML += `targetWindow オブジェクト取得: OK\n`;
                
                // COOP が有効な場合、別オリジンかつ新しいコンテキストグループになるため、
                // 親から子のクロスドメインプロパティ読み取り制限が発生するか、closed 状態の判定が変わります
                try {
                    logEl.innerHTML += `targetWindow.closed: ${targetWindow.closed}\n`;
                    logEl.innerHTML += `[検証結果] タブが開きました。開いた先の Visualforce ページ画面内の表示（openerの有無）を確認してください。\n`;
                } catch (e) {
                    logEl.innerHTML += `アクセスエラー: ${e.message}\n`;
                }
            }, 2000);
        }
    </script>
</body>
</html>
